[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trillion"
version = "0.1.0"
description = "Trillion: the core of a voice-first AI assistant."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "elevenlabs>=1.9.0",
    "requests>=2.31.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "pynput>=1.7.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
