[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trillion"
version = "0.1.0"
description = "Trillion: the core of a voice-first AI assistant."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "elevenlabs>=1.9.0",
    "requests>=2.31.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "pynput>=1.7.6",
    "pyyaml>=6.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# Windows-only (wraps a running MT5 terminal via local IPC) -- not
# installable on Linux/macOS, so it's opt-in rather than a base dependency.
mt5 = ["MetaTrader5>=5.0.45"]

[tool.setuptools.packages.find]
where = ["src"]
