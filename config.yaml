# Trillion's tunable settings. Edit freely; nothing here needs a code
# change to take effect (the model name can also be overridden with the
# TRILLION_MODEL env var, which always wins over this file).

model:
  name: claude-sonnet-5

tools:
  # Tool names that must be confirmed by the user before they run, on top
  # of whatever a tool already declares in its own code. This can only
  # widen the confirmation gate, never narrow it below what a tool's own
  # author decided was unsafe to run unattended (e.g. forget_fact is
  # always gated, config or no config, because it deletes data).
  require_confirmation: []

heartbeat:
  # How often the background loop wakes up to see if anything is due.
  poll_interval_seconds: 30

  # Non-urgent notices wait for this window to end before interrupting you.
  # 24-hour local time; wraps past midnight (e.g. 22:00 -> 07:00 is fine).
  quiet_hours:
    start: "22:00"
    end: "07:00"

  # Each check: how often it runs, and its own params. Unknown check
  # names are ignored rather than crashing the loop. Add a new check by
  # writing one function in trillion/heartbeat/checks.py, registering it
  # in CHECKS, then listing it here.
  checks:
    - name: notes_watch
      enabled: true
      interval_seconds: 30
      params:
        # Surfaces an interruption if this phrase shows up anywhere in
        # your notes. Handy for testing the heartbeat end to end: add a
        # line containing this phrase to a note and watch it get noticed.
        query: "URGENT"

    - name: open_reminders_digest
      enabled: true
      interval_seconds: 300
      params: {}

    - name: gold_signal
      # Reaches out to Yahoo Finance over the network on every run, unlike
      # the other (local-only) checks above — make sure that's reachable
      # from wherever this runs before relying on it (this build sandbox's
      # network policy blocks it outright; your own machine may not).
      enabled: true
      interval_seconds: 900
      params:
        symbol: "XAUUSD=X"   # gold/USD; yfinance also accepts "GC=F" for gold futures
        interval: "15m"
        lookback: "5d"
        # Which strategy.py class computes the signal (see STRATEGIES in
        # src/trillion/trading/strategy.py) — swap in a new one by adding
        # a class there and changing this name, no other code change.
        strategy: "moving_average_cross"
        fast_period: 20
        slow_period: 50
